<section class="spinning-wheel" aria-label="Spinning Wheel">
	<div class="spinning-wheel__wheel">
		<ul class="spinning-wheel__prizes"></ul>
	</div>
	<div class="spinning-wheel__frame" aria-hidden="true"></div>
	<div class="spinning-wheel__pointer" aria-hidden="true"></div>
	<button class="spinning-wheel__button" type="button"></button>
	<div class="spinning-wheel__result"></div>

	<template id="spinning-wheel-prize-template">
		<li class="spinning-wheel__prize">
			<span class="spinning-wheel__prize-icon" aria-hidden="true"></span>
		</li>
	</template>
</section>
